# Butterfly theme config - reconstructed from the Marlin static build.
# Phase 1: static pages (source/) do not consume this file; it documents the
# original theme settings so generated pages (posts, archives) match later.
# Phase 2 will complete/verify every key against the original site.

# Nav menu (2026-08-15: archives/categories/templates/Gallery removed,
# moments promoted to top level)

nav:
  logo: /img/brand/magic-cube-logo.png
  display_title: true
  display_post_title: false
menu:
  首页: /
  文章: /articles/
  工程: /projects/
  音乐: /music/
  说说: /moments/
  关于: /about/

# Sidebar avatar (2026-09-03: 由 logo1.jpg 更换为 headpicture.jpg, 与关于页头像一致)
avatar:
  img: /img/brand/headpicture.jpg
  effect: false

# Site data shown in sidebar (2026-08-15: archives/categories removed, block dropped)
# site_data:
#   posts: 23
#   tags: 16

# Dark / light mode (original defaults to dark)
# object form so the theme renders the #darkmode rightside button on
# hexo-rendered pages (post pages); static pages carry their own button
darkmode:
  enable: true
  button: true

# PJAX 说明(A3, 2026-09-02): 本站 PJAX 由 themes/butterfly/layout/parts-common/footer.html
# 的自定义实例实现(前缀排除 + 404 兜底), 不依赖主题自带 third-party/pjax.pug。
# ★ 勿开启下方开关: 主题版渲染链(additional-js → third-party/pjax)在本站自制 base.pug
# 下不存在, 开启会导致双实例/行为不一致。需要调整请在 footer.html 内维护。
# （2026-09-02 实测对比: 主题版方案体验与自定义版一致, 但丢失前缀排除/404 兜底, 弃用。）
pjax:
  enable: false
  exclude:

# Local search (original: search.xml, preload=false, top_n=1, unescape=true, 8 hits/page)
search:
  use: local_search
  placeholder:
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: true
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

# Code highlight (original: highlight.js with copy + lang label)
highlight:
  enable: true
  line_number: true
  autodetect: false
  copy: true
  lang: true
  height_limit: false
  fullpage: false
  macStyle: false

# Lightbox (original: medium_zoom)
lightbox: medium_zoom

# Right-side widgets (original: darkmode toggle, hide-aside, settings, go-up with scroll percent)
rightside:
  enable: true
  hide_scroll_percent: false

# Footer (will be replaced with your identity in phase 2)
footer:
  owner: Marlin
  since: 2025


# ---- DeYmo custom layer for hexo-rendered pages (articles from _posts) ----
display_mode: dark

# 文章页统一背景图:marlin 参考站 go语法总结 同款 leetcode.webp,同位置
# (header 400px, background center/cover, 暗色遮罩),2026-08-17
default_top_img: /img/hero/post-hero-banner.webp

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css?v=20260831-p36">
    - <link rel="stylesheet" href="/rose-galaxy/css/project-detail-page.css?v=20260831-p36">
    - <link rel="stylesheet" href="/rose-galaxy/css/nova-player.css?v=20260831-p36">
    - <link rel="stylesheet" href="/rose-galaxy/css/nova-visitor.css?v=20260831-p36">
    - <script defer src="/rose-galaxy/js/lib/site-config.js?v=20260831-p36"></script>
    - <script defer src="/rose-galaxy/js/lib/utils.js?v=20260831-p36"></script>
    - <script defer src="/rose-galaxy/js/nova-player.js?v=20260831-p36"></script>
  bottom:
    - <script src="/rose-galaxy/js/nova-ux.js?v=20260831-p36"></script>
    - <script src="/rose-galaxy/js/nova-visitor.js?v=20260831-p36"></script>
    - <script src="/rose-galaxy/animation/decorative-loader.js?v=20260831-p36"></script>

# Side widgets (2026-08-16: archives/categories widgets disabled; they
# link to pages removed on 2026-08-15)
aside:
  card_archives:
    enable: false
  card_categories:
    enable: false

# ---- 评论系统 (P2.7: Waline v2 后端 + Neon PostgreSQL) ----
comments:
  use: [Waline]
  text: true
  lazyload: false
  count: true
  card_post_count: true
waline:
  serverURL: https://marlincn-github-io.vercel.app
  pageview: false
  option:
