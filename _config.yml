# Hexo Configuration
# Reconstructed from the Marlin static build (mikejosion.github.io).
# Placeholders: title / author / description / url / deploy repo will be
# replaced with your own identity later.

# Site
title: Marlin
subtitle: ''
description: '记录 Markdown 学习笔记、AI 工具实践与日常折腾的个人博客。'
keywords:
author: Marlin
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://marlincn.github.io/
version: 20260831-p19
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: articles
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
  - '.nojekyll'
exclude:
ignore:
# Phase 1: the whole original site lives in source/ as static files.
# skip rendering so they are copied to public/ byte-identically.
skip_render:
  - '**/*.html'

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo: https://github.com/Marlincn/Marlincn.github.io.git
  branch: public
  ignore_hidden: false

# Local search data file (static search.xml, maintained by hand)
search:
  path: search.xml
  field: post
  content: true
  format: html
